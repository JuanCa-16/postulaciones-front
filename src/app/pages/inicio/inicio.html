<div class="inicio-container">
  <header>
    <h1>Mis Postulaciones</h1>
    <button type="button" class="btn" [routerLink]="['/agregar']">Agregar</button>
  </header>
  <div class="postulaciones">
    @if (cargando()) {
      <app-loading />
    } @else if (error()) {
      <p>{{ error() }}</p>
    } @else if (postulaciones().length > 0) {
      @for (postulacion of postulaciones(); track postulacion.id) {
        <app-job-card [postulacion]="postulacion" (eliminar)="eliminarPostulacion($event)">
        </app-job-card>
      }
    } @else {
      <p>No tienes postulaciones registradas.</p>
    }
  </div>
</div>
