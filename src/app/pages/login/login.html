@if (cargando()) {
  <app-loading />
}

<div class="formulario-container">
  <app-header titulo="Inicio de Sesión" subtitulo="Ingresa tus credenciales"></app-header>

  <form class="formulario" [formGroup]="formulario" (ngSubmit)="guardar()">
    <div class="inputs-group">
      <app-input-field
        type="email"
        autocomplete="email"
        controlName="usuario"
        label="Correo*"
        placeholder="ejemplo@correo.com"
        error="Ingresa un correo electrónico válido."
        [mostrarError]="esCampoInvalido('usuario')"
      />

      <app-input-field
        type="password"
        autocomplete="current-password"
        controlName="clave"
        label="Contraseña*"
        placeholder="Ingresa tu contraseña"
        error="La contraseña es obligatoria."
        [mostrarError]="esCampoInvalido('clave')"
      />
    </div>

    <footer class="modal-actions">
      <button type="submit" class="btn-submit">Ingresar</button>
    </footer>
  </form>
</div>
