<div class="container">
  <div class="estado-input-container">
    <div class="input-container">
      <input type="text" maxlength="20" [placeholder]="placeholder()" [(ngModel)]="titulo" />
    </div>

    <div class="color-picker-wrapper">
      <input type="color" [(ngModel)]="color" id="colorPicker" />
    </div>

    <app-chip
      tipo="checkbox"
      label="Defecto"
      [checked]="porDefecto()"
      (checkedChange)="onDefectoChange($event)"
    />

    <!-- Botón de Guardar (Check) -->
    <button
      type="button"
      class="btn-guardar-check"
      [class.visible]="haCambiado()"
      [disabled]="!haCambiado()"
      (click)="guardar()"
      title="Guardar cambios"
    >
      <app-icon-check></app-icon-check>
    </button>

    <!-- Botón de Eliminar (Papelera) -->
    @if (mostrarEliminar()) {
      <button
        type="button"
        class="btn-icon btn-eliminar"
        (click)="abrirModalEliminar()"
        title="Eliminar estado"
      >
        <app-icon-trash></app-icon-trash>
      </button>
    }
  </div>

  <div class="preview-footer">
    <span class="preview-label">Vista previa:</span>
    <app-tag [estadoManual]="true" [titulo]="titulo()" [color]="color()" />
  </div>
</div>

@if (mostrarModalEliminar()) {
  <app-modal
    titulo="¿Eliminar Estado?"
    subtitulo="Esta acción no se puede deshacer."
    (onCancelar)="cancelarEliminar()"
    (onConfirmar)="confirmarEliminacion()"
  ></app-modal>
}
