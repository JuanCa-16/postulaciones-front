<div class="empty-state-container">
  <div class="vector-wrapper">
    <svg class="empty-vector" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="80" fill="var(--input-background)" opacity="0.6" />
      <rect
        x="65"
        y="50"
        width="70"
        height="90"
        rx="10"
        fill="var(--background)"
        stroke="var(--input-focused-border)"
        stroke-width="3"
      />
      <rect x="80" y="70" width="40" height="6" rx="3" fill="var(--text-secondary)" opacity="0.4" />
      <rect x="80" y="86" width="30" height="6" rx="3" fill="var(--text-secondary)" opacity="0.3" />
      <g class="lupa-group" transform="translate(10, 10)">
        <circle
          cx="115"
          cy="115"
          r="22"
          fill="var(--background)"
          stroke="var(--main-color)"
          stroke-width="4"
        />
        <line
          x1="130"
          y1="130"
          x2="148"
          y2="148"
          stroke="var(--main-color)"
          stroke-width="4"
          stroke-linecap="round"
        />
        <circle cx="107" cy="107" r="3" fill="var(--main-color)" opacity="0.6" />
      </g>
    </svg>
  </div>

  <div class="content">
    <h3 class="title">{{ title() }}</h3>
    <p class="description">{{ description() }}</p>
  </div>

  <!-- Contenedor donde se inyectarán los botones que tú le pases desde afuera -->
  <div class="actions">
    <ng-content></ng-content>
  </div>
</div>
